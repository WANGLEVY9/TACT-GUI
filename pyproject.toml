[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "budgetmas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
pilot = ["catboost==1.2.10"]
[project.scripts]
budgetmas = "budgetmas.cli:main"
budgetmas-console = "budgetmas.console:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budgetmas = ["console_static/*"]
