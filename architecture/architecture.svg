<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17243d}.title{font-size:35px;font-weight:750}.sub{font-size:17px;fill:#62738b}.section{font-size:20px;font-weight:700}.h{font-size:19px;font-weight:700}.p{font-size:15px;fill:#42546d}.small{font-size:14px;fill:#52647b}.badge{font-size:13px;font-weight:700;fill:#176652}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#a)}.dash{stroke-dasharray:7 6}.box{fill:white;stroke:#d5dfeb;stroke-width:1.5}.blue{fill:#eef5ff;stroke:#bdd4f3}.green{fill:#edfaf5;stroke:#a9dec9}.purple{fill:#f5f1ff;stroke:#d7c9f5}.amber{fill:#fff8e9;stroke:#ecd29b}</style></defs>
<rect width="1600" height="1540" fill="#f4f7fb"/>
<text x="70" y="70" class="title">固定预算下的自适应多智能体测试架构</text><text x="70" y="105" class="sub">候选设计 · 运行时闭环、训练与评估路线 · 2026.11</text>
<rect x="70" y="135" width="1460" height="100" rx="16" class="box"/><text x="95" y="168" class="h">输入：测试目标与全局预算 B</text><text x="95" y="199" class="p">被测系统 / 测试场景　 ·　 可用 Agent、模型与工具　 ·　 预算与成本口径　 ·　 缺陷确认标准</text><rect x="1180" y="158" width="315" height="52" rx="10" class="green"/><text x="1200" y="190" class="badge">目标：同预算下更高的有效测试收益</text>
<path d="M800 235 V270" class="arrow"/>
<rect x="70" y="270" width="1460" height="660" rx="20" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/><text x="95" y="307" class="section">① 在线测试与预算决策闭环</text><text x="1430" y="307" text-anchor="end" class="small">每轮基于新反馈重新决策</text>
<rect x="100" y="335" width="400" height="145" rx="14" class="blue"/><text x="120" y="367" class="h">测试状态与任务管理</text><text x="120" y="397" class="p">任务及依赖 · 环境状态 · 测试进度</text><text x="120" y="422" class="p">Agent 能力 · 成本历史 · 剩余预算</text><text x="120" y="447" class="p">异常线索 · 待验证证据及预计需求</text>
<rect x="600" y="335" width="400" height="145" rx="14" class="purple"/><text x="620" y="367" class="h">状态表示与价值 / 成本估计</text><text x="620" y="397" class="p">候选：动态异构图、预算条件编码</text><text x="620" y="422" class="p">估计协作增量收益、成本与不确定性</text><text x="620" y="447" class="p">可选：测试状态转移与有限前瞻</text>
<rect x="1100" y="335" width="400" height="145" rx="14" class="purple"/><text x="1120" y="367" class="h">预算条件联合调度器</text><text x="1120" y="397" class="p">选择任务、Agent / 模型及协作方式</text><text x="1120" y="422" class="p">设定预算上限；决定继续、切换或停止</text><text x="1120" y="447" class="p">考虑依赖、未来验证与资源竞争</text>
<path d="M500 405 H590" class="arrow"/><path d="M1000 405 H1090" class="arrow"/><path d="M1300 480 V525" class="arrow"/>
<rect x="1100" y="535" width="400" height="145" rx="14" class="amber"/><text x="1120" y="567" class="h">预算准入与共享账本</text><text x="1120" y="597" class="p">可行性检查 → 原子预留 → 执行封顶</text><text x="1120" y="622" class="p">实际结算 → 回收未使用额度</text><text x="1120" y="647" class="p">支出 + 已承诺额度 ≤ 总预算</text>
<rect x="600" y="535" width="400" height="145" rx="14" class="green"/><text x="620" y="567" class="h">多智能体测试执行器</text><text x="620" y="597" class="p">可替换的单 Agent / 多 Agent 配置</text><text x="620" y="622" class="p">调用模型、工具及被测系统</text><text x="620" y="647" class="p">记录轨迹、资源使用与执行结果</text>
<rect x="100" y="535" width="400" height="145" rx="14" class="blue"/><text x="120" y="567" class="h">结果验证与状态更新</text><text x="120" y="597" class="p">复现、验证、去重与证据归档</text><text x="120" y="622" class="p">更新任务、环境与待验证线索</text><text x="120" y="647" class="p">依据实际结算更新可用预算</text>
<path d="M1100 607 H1010" class="arrow"/><path d="M600 607 H510" class="arrow"/><path d="M300 535 V490" class="arrow"/>
<rect x="100" y="730" width="1400" height="150" rx="14" fill="#f8fafc" stroke="#dce5ef"/><text x="122" y="762" class="h">关键执行约束与实施边界</text><text x="122" y="793" class="p">硬预算保证有前提：所有相关支出经过统一账本，单次实际费用不超过可强制的预留上界；并发、重试和失败均须纳入。</text><text x="122" y="820" class="p">验证需求是规划预测量；若某项验证必须完成，需要单独预留可执行上界。成本预测或奖励惩罚本身不能保证不超支。</text><text x="122" y="847" class="p">总成本口径还应覆盖调度器、Agent 通信、模型 / 工具调用、环境重置和验证；可分别记录时间、Token 等其他资源。</text>
<path d="M800 930 V970" class="arrow"/>
<rect x="70" y="970" width="1460" height="300" rx="20" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/><text x="95" y="1007" class="section">② 离线数据、模型训练与实验评估</text>
<rect x="100" y="1030" width="400" height="150" rx="14" class="blue"/><text x="120" y="1063" class="h">可复现实验与轨迹数据</text><text x="120" y="1092" class="p">相同可恢复状态下比较多种配置</text><text x="120" y="1117" class="p">记录选择概率、成本、状态与验证结果</text><text x="120" y="1142" class="p">控制环境隔离、执行顺序和随机性</text>
<rect x="600" y="1030" width="400" height="150" rx="14" class="purple"/><text x="620" y="1063" class="h">训练与更新候选模型</text><text x="620" y="1092" class="p">状态表示 / 反事实价值 / 成本分布</text><text x="620" y="1117" class="p">结构化策略与有限前瞻：按数据决定</text><text x="620" y="1142" class="p">离线学习、在线强化学习：可选深化</text>
<rect x="1100" y="1030" width="400" height="150" rx="14" class="green"/><text x="1120" y="1063" class="h">公平对照与消融</text><text x="1120" y="1092" class="p">固定 / 动态预算 × 固定 / 动态协作</text><text x="1120" y="1117" class="p">贪心、预算调度与通用路由等基线</text><text x="1120" y="1142" class="p">统一预算、工具权限、验证与总成本</text>
<path d="M500 1105 H590" class="arrow"/><path d="M1000 1105 H1090" class="arrow"/><text x="105" y="1230" class="small">反馈：将在线轨迹和验证结果用于数据集；经过评估的模型再用于在线价值估计和调度。实线表示流程，训练及回流为跨轮次过程。</text>
<rect x="70" y="1305" width="1460" height="175" rx="20" fill="#eaf1fa"/><text x="95" y="1343" class="section">③ 从实验环境到方法研究：建议实施顺序</text><text x="100" y="1382" class="p">P0　选定测试类型与底座 → 建立可恢复环境、可验证指标和完整记账</text><text x="100" y="1413" class="p">P1　实现规则调度、预算准入及多配置执行 → 验证协作收益差异与动态分配是否必要</text><text x="100" y="1444" class="p">P2　采集受控数据并比较强基线 → 再按证据引入反事实学习、结构化模型或前瞻规划</text>
<text x="70" y="1515" class="small">注：图中学习模块和技术组合均为研究候选，尚未证明创新性或实验优势；ScenGen 只是待检查适配性的候选底座。</text>
</svg>
